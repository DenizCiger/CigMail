[package]
name = "cigmail-core"
description = "CigMail without a window: the mail cache, the providers and the sync engine, shared by the app and the server."
edition.workspace = true
version.workspace = true
authors.workspace = true

[features]
# Keep credentials in the OS keyring (Secret Service / Keychain / Credential Manager) instead of
# the database. For desktop builds of the app.
keyring = ["dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.11"
mail-parser = "1.0.1"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
chrono = { version = "0.4.45", features = ["serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
futures = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
parking_lot = "0.13.0"
html2text = "0.17.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "form", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "4.2.0", optional = true }
