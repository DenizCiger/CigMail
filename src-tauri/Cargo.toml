[package]
name = "cigmail"
version = "0.1.0"
description = "A fast, keyboard-first unified email client"
authors = ["Deniz Ciger <deniz@ciger.dev>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cigmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.11"
mail-parser = "1.0.1"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
chrono = { version = "0.4.45", features = ["serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
futures = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
parking_lot = "0.13.0"
html2text = "0.17.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "form", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"

# No Secret Service / Keychain equivalent on Android; secrets live in the app-private database there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.2.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
