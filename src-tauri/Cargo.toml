[package]
name = "cigmail"
version = "0.1.0"
description = "A fast, keyboard-first unified email client"
authors = ["Deniz Ciger <deniz@ciger.dev>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cigmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cigmail-core = { path = "../crates/cigmail-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
chrono = { version = "0.4.45", features = ["serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
futures = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "form", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"

# No Secret Service / Keychain equivalent on Android; secrets live in the app-private database there.
# stdout goes nowhere on Android; send tracing output to logcat instead.
[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
cigmail-core = { path = "../crates/cigmail-core", features = ["keyring"] }
tauri-plugin-single-instance = "2"

# Linux: a tray icon that opens the window on left-click (Tauri's appindicator tray only shows a
# menu), and notifications that open the conversation when clicked.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
gtk = "0.18"

[dev-dependencies]
cigmail-server = { path = "../crates/cigmail-server" }
tempfile = "3"
